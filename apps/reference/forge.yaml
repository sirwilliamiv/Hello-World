# reference — generated by `forge init`.
# This is the only file a human edits during routine onboarding.
manifest_version: 1

catalog:
  snapshot: "2026-07-15"

product:
  id: reference
  name: reference
  client:
    name: Reference Client LLC
    legal_entity: Reference Client LLC

# The kernel is mandatory and implicit — never list it here.
# Hard dependencies resolve automatically; `forge graph` shows what gets added.
capabilities:
  - id: pay.card
  - id: pay.invoices

# Credentials are NAMES, never values. `forge validate` checks presence
# only; `forge apply` resolves them in memory and never writes them anywhere.
integrations:
  object_storage:
    credentials:
      STORAGE_BUCKET: { secret_ref: reference/storage_bucket }  # data.files
      STORAGE_CREDENTIALS: { secret_ref: reference/storage_credentials }  # data.files
  queue_backend:
    credentials:
      QUEUE_URL: { secret_ref: reference/queue_url }  # ops.queue
  smtp:
    credentials:
      MAIL_DSN: { secret_ref: reference/mail_dsn }  # kernel.mail
  stripe:
    credentials:
      STRIPE_SECRET_KEY: { secret_ref: reference/stripe_secret_key }  # pay.card
      STRIPE_WEBHOOK_SECRET: { secret_ref: reference/stripe_webhook_secret }  # pay.card

environments:
  development:
    provider: local
    secrets:
      provider: file
      path: .forge/secrets.json
